[project]
name = "scm-fresh-start"
version = "0.3.0"
description = "Get a Strata Cloud Manager tenant with no configuration of its own, like a new Panorama"
license = "Apache-2.0"
requires-python = ">=3.9"
# Kept in step with requirements.txt, which CI installs.
dependencies = ["requests>=2.28"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
